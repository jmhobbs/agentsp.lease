<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="Agent's Please?">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://agentsp.lease/og.jpg">
    <meta property="og:url" content="https://agentsp.lease/">
    <meta property="og:description" content="Badges to indicate whether a project allows or disallows AI use.">
    <title>Agents Please?</title>
    <style>
      * {
        font-family: Avenir, Montserrat, Corbel, 'URW Gothic', source-sans-pro, sans-serif;
      }
      html, body {
        margin: 0;
      }
      body {
        padding: 0;
      }
      main {
        max-width: 50em;
        margin: 0 auto;
      }
      main > div {
        padding: 0 0.5em;
      }
      pre {
        background: #f0f0f0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 0.2em 0.4em;
      }
      code {
        font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
        font-size: 0.8em;
      }
      footer {
        text-align: center;
        padding: 1em 0;
        font-size: 0.8em;
      }
      footer a {
        color: #333;
      }
      #no, #yes {
        display: inline-block;
        font-size: 2em;
        padding: 0.5em 1em;
        text-decoration: none;
        border-radius: 0.75em;
        margin: 0 0.5em;
      }
      #no:hover, #yes:hover {
        text-decoration: underline;
      }
      #no {
        background-color: #cb0a0a;
        color: #fff;
      }
      #yes {
        background-color: #0a6b45;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Agents Please?</h1>
        <p>Some projects allow and desire AI use, some projects explicitly do not want it.  We should respect one anothers requests, and make it simple to know which is desired.</p>
        <h2>Do you use AI in your project?</h2>
        <p style="text-align: center;">
          <a href="https://no.agentsp.lease/" id="no">No</a>
          <a href="https://yes.agentsp.lease/" id="yes">Yes</a>
        </p>
      </div>
    </main>
    <footer><a href="https://github.com/jmhobbs/agentsp.lease">View on GitHub</a></footer>
  </body>
</html>
